[package]
name = "fma-fetch"
description = "Find a firmware package from a GitHub link, download it once, keep it in a local library"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

# GitHub over the network: natively only. In a browser the page asks a server that has this.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", features = ["json"] }
